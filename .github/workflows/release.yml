# A push to main that changes the image (or a manual run on main): every CI check (ci.yml,
# gated on its CI aggregate), then the next version, each platform built natively in
# parallel in jobs without write permissions, combined into one multi-arch image and
# checked, published to GHCR as exactly those bytes, and the tag and GitHub Release with
# the index digest. See README.md › Release.
name: release

on:
  push:
    branches: [main]
    # The image's build context: what .dockerignore lets in (test_release_image.py keeps
    # them equal), less the entrypoint's tests, which are not in the binary.
    paths:
      - .dockerignore
      - Dockerfile
      - proxy/**
      - start.sh
      - verify-egress
      - egress-install
      - install.sh
      - compose.yaml
      - compose.remote.yaml
      - config.example.yaml
      - config.default.yaml
      - "!proxy/tests/**"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order, never cancelled mid-publish. A newer push replaces
# a pending run, not a running one; its commit holds the replaced one's changes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/windroc-labs/egress-proxy

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Every guard before anything is built or written: a main commit after the last release,
  # no Release yet, and the version not in GHCR yet.
  prepare:
    name: prepare
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      contract: ${{ steps.meta.outputs.contract }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # origin/main and the tags, for the ancestry checks and the next version.
          fetch-depth: 0
      - name: Revision, next version and contract; the commit is on main
        id: meta
        run: |
          revision=$(git rev-parse HEAD)
          python3 -B .github/release_image.py on-main "$revision"
          version=$(python3 -B .github/release_image.py next-version "$revision")
          contract=$(python3 -B .github/release_image.py contract)
          { echo "version=$version"; echo "revision=$revision"; echo "contract=$contract"; } >>"$GITHUB_OUTPUT"
      - name: The Release does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 -B .github/release_image.py release-absent --tag "v$VERSION"
      - name: The version is not in GHCR yet
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          auth=$RUNNER_TEMP/ghcr-auth.json
          trap 'rm -f "$auth"' EXIT
          skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$TOKEN"
          python3 -B .github/release_image.py registry-absent --repo "$IMAGE" --version "$VERSION" --authfile "$auth"

  # Third-party actions and the Rust build run here, with read permissions only: each
  # platform on a runner of its own architecture, in parallel.
  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The checkout is the commit prepare checked
        env:
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$REVISION"
      - uses: ./.github/actions/build-image
        with:
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.revision }}
          platform: linux/${{ matrix.arch }}
          out: ${{ runner.temp }}/layout
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-${{ matrix.arch }}
          path: ${{ runner.temp }}/layout
          retention-days: 1
          if-no-files-found: error

  # The only job with write permissions: first-party actions, stdlib Python, skopeo and gh.
  # If it fails after the push, "Re-run failed jobs" (within the artifact's day) completes
  # it: publish accepts a tag that already holds exactly this layout.
  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ needs.prepare.outputs.revision }}
      CONTRACT: ${{ needs.prepare.outputs.contract }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: layout-*
          path: ${{ runner.temp }}/layouts
      # Every blob is checked against its digest, so what is pushed is what this step checked.
      - name: Combine both platforms into one index and check every layer, the history and the labels
        env:
          EGRESS_RELEASE_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/release_image.py combine "$RUNNER_TEMP/layout" \
            "$RUNNER_TEMP/layouts/layout-amd64" "$RUNNER_TEMP/layouts/layout-arm64"
          python3 -B .github/release_image.py check "$RUNNER_TEMP/layout" --version "$VERSION" \
            --revision "$REVISION" --contract "$CONTRACT"
      - name: Publish to GHCR and verify it by digest
        id: publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$RUNNER_TEMP/ghcr-auth.json
          trap 'rm -f "$auth"' EXIT
          skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io <<<"$TOKEN"
          python3 -B .github/release_image.py publish "$RUNNER_TEMP/layout" --repo "$IMAGE" \
            --version "$VERSION" --authfile "$auth"
          digest=$(python3 -B .github/release_image.py digest "$RUNNER_TEMP/layout")
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Create the tag and the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          python3 -B .github/release_image.py release-create --version "$VERSION"
          --contract "$CONTRACT" --digest "$DIGEST" --revision "$REVISION" --repo "$IMAGE"
      - name: Remove the registry credential
        if: always()
        run: rm -f "$RUNNER_TEMP/ghcr-auth.json"
