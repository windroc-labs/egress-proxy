# Builds one platform of the image into a new OCI layout (release_image.py build), on a
# runner of that architecture. The one home of the builder pins. Used only by jobs without
# write permissions: ci.yml `image-build` and release.yml `build`; the job that combines
# the platforms' layouts checks the result (release_image.py combine and check).
name: build-image
description: Build one platform of the egress-proxy image into an OCI layout.

inputs:
  version:
    description: The image version label, X.Y.Z.
    required: true
  revision:
    description: The commit the image is built from (40 hex).
    required: true
  platform:
    description: The platform to build, linux/amd64 or linux/arm64; the runner's own.
    required: true
  out:
    description: The OCI layout directory to create; it must not exist.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    - name: Build ${{ inputs.platform }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        PLATFORM: ${{ inputs.platform }}
        OUT: ${{ inputs.out }}
      run: |
        contract=$(python3 -B .github/release_image.py contract)
        python3 -B .github/release_image.py build --version "$VERSION" --revision "$REVISION" \
          --contract "$contract" --platform "$PLATFORM" --out "$OUT"
