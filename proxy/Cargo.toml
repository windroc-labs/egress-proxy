[package]
name = "proxy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Entrypoint of the egress proxy image: generates each caller network's smokescreen policy and supervises one smokescreen per network."

[dependencies]
ipnet = { version = "2.12.2", features = ["serde"] }
nix = { version = "0.31.3", features = ["signal", "process", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3"
