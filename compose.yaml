# The egress proxy: one container serving every caller network. Start, upgrade, or add
# or remove a caller network with ./start.sh, never a bare `docker compose up`: the caller
# networks, EGRESS_NETWORKS and their labels come from the compose override start.sh
# renders from the config's sections (~/.egress/compose.networks.yaml); see README.md.
name: egress

services:
  proxy:
    build: .
    container_name: egress-proxy
    restart: unless-stopped
    # Longer than the entrypoint's own 10 s grace for its smokescreens, so a stop exits 0.
    stop_grace_period: 20s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run/egress:mode=0700,uid=65532,gid=65532
    # The directory, not the file: a single-file bind mount keeps the old inode when an
    # editor saves by replacing the file, hiding the edit from the proxy.
    volumes:
      - type: bind
        source: ${EGRESS_CONFIG_DIR:-${HOME}/.egress}
        target: /etc/egress
        read_only: true
        bind:
          create_host_path: false
    # Docker Desktop resolves host.docker.internal itself; this makes Linux match, so the
    # proxy always knows (and denies) the host's address.
    extra_hosts:
      - host.docker.internal:host-gateway
    # Label contract v1 (docs/label-contract.md). start.sh's override adds EGRESS_NETWORKS,
    # the networks and per-network labels and the caller network attachments; the proxy
    # refuses a config whose network keys differ from EGRESS_NETWORKS.
    labels:
      windroc.egress.contract: "1"
    networks:
      uplink: {}

networks:
  # The proxy's own way out. IPv4 only: the deny floor has no global IPv6 LAN prefix.
  uplink:
    name: egress-uplink
    enable_ipv6: false
