# Every pull request: build and test the entrypoint, lint the repo, build the image and
# run the Docker end-to-end checks, and build, check and publish the multi-arch image to a
# local registry (the release path, without GHCR) and install it from there by digest. CI aggregates every job for branch
# protection; release.yml calls this workflow before it publishes.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: shellcheck tests/*.sh start.sh verify-egress install.sh egress-install
      - name: Check aggregate job dependencies
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -B -m unittest discover -s .github -p 'test_*.py' -v
          python3 -B .github/check_ci_needs.py
      - run: tests/check-repo.sh
      - run: tests/check-repo-selftest.sh
      - run: tests/verify-egress-selftest.sh
      - run: tests/install-selftest.sh
      - name: Dockerfile build checks
        run: docker build --check .
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color
      - name: compose files are valid
        env:
          EGRESS_CONFIG_DIR: ${{ runner.temp }}
          EGRESS_IMAGE: egress-proxy
        run: docker compose -f compose.yaml config -q

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: tests/integration.sh

  image:
    name: image
    runs-on: ubuntu-24.04
    # arm64 builds under QEMU.
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      registry:
        image: docker.io/library/registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-image
        with:
          version: 0.0.0
          revision: ${{ steps.revision.outputs.sha }}
          out: ${{ runner.temp }}/layout
          scan-token: ${{ github.token }}
      - name: Publish to the local registry and verify it by digest
        run: >-
          python3 -B .github/release_image.py publish "$RUNNER_TEMP/layout"
          --repo localhost:5000/egress-proxy --version 0.0.0 --insecure
      - name: Install it from the local registry by digest, end to end
        env:
          REGISTRY: ${{ job.services.registry.id }}
        run: >-
          tests/install-integration.sh localhost:5000/egress-proxy 0.0.0
          "$(python3 -B .github/release_image.py digest "$RUNNER_TEMP/layout")" "$REGISTRY"

  ci:
    name: CI
    needs: [rust, lint, integration, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed, was cancelled or was skipped
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
