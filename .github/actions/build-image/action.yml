# Builds both platforms of the image into a new OCI layout and checks it (release_image.py
# build and check). The one home of the builder pins. Used only by jobs without write
# permissions: ci.yml `image` and release.yml `build`.
name: build-image
description: Build the multi-arch egress-proxy image into an OCI layout and check it.

inputs:
  version:
    description: The image version label, X.Y.Z.
    required: true
  revision:
    description: The commit the image is built from (40 hex).
    required: true
  out:
    description: The OCI layout directory to create; it must not exist.
    required: true
  scan-token:
    description: The job's token; the check fails if the layout holds it (NFR-5).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
        cache-image: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
    - name: Build linux/amd64 and linux/arm64
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        OUT: ${{ inputs.out }}
      run: |
        contract=$(python3 -B .github/release_image.py contract)
        python3 -B .github/release_image.py build --version "$VERSION" --revision "$REVISION" \
          --contract "$contract" --out "$OUT"
    - name: Check every layer, the history and the labels
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision }}
        OUT: ${{ inputs.out }}
        EGRESS_RELEASE_TOKEN: ${{ inputs.scan-token }}
      run: |
        contract=$(python3 -B .github/release_image.py contract)
        python3 -B .github/release_image.py check "$OUT" --version "$VERSION" --revision "$REVISION" \
          --contract "$contract"
