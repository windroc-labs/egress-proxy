# Every pull request: build and test the entrypoint, lint the repo, build the image and
# run the Docker end-to-end checks. Every job must pass before merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: shellcheck tests/*.sh
      - run: tests/check-repo.sh
      - name: compose files are valid
        env:
          EGRESS_CONFIG_DIR: ${{ runner.temp }}
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f tests/compose.test.yaml config -q

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: tests/integration.sh
