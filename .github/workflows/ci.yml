# Every pull request: build and test the entrypoint, lint the repo, build the image and
# run the Docker end-to-end checks. CI aggregates every job for branch protection.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: shellcheck tests/*.sh start.sh
      - name: Check aggregate job dependencies
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -B -m unittest discover -s .github -p test_ci_needs.py -v
          python3 -B .github/check_ci_needs.py
      - run: tests/check-repo.sh
      - run: tests/check-repo-selftest.sh
      - name: Dockerfile build checks
        run: docker build --check .
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color
      - name: compose files are valid
        env:
          EGRESS_CONFIG_DIR: ${{ runner.temp }}
        run: docker compose -f compose.yaml config -q

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: tests/integration.sh

  ci:
    name: CI
    needs: [rust, lint, integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed, was cancelled or was skipped
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
