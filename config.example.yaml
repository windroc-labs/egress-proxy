# Example of ~/.egress/config.local.yaml, the egress gateway's local config. Copy it there
# and edit it. After a change to a section's policy, restart the gateway:
#   docker compose restart gateway
# After adding or removing a section, run the start command instead: ./start.sh
# A missing key, an unknown key or a bad value stops the gateway at start; `docker logs
# egress-gateway` names the network and the key. Keep LAN and other private addresses in
# your local copy only, never in this repo.
#
# The commented examples between "example:" and "end example" lines are valid as written:
# remove one "# " from each of their lines to use them (gateway/src/config.rs tests that).

# Format version; only 1 exists.
version: 1

# One section per caller network: the only list of them. ./start.sh attaches the gateway to
# Docker network egress-<key> for each section and advertises it in the gateway's labels
# (docs/label-contract.md). Keys: lower-case letters, digits and "-"; "uplink" is reserved.
networks:
  workers:
    # denylist: everything public is allowed; private, local and LAN ranges are denied
    # (the deny floor in README.md, plus host.docker.internal and the gateway's own
    # addresses). allowlist: only the domains under `allow` are allowed.
    mode: denylist

    # Optional. Ranges denied on top of the floor, in CIDR form. The gateway cannot see the
    # Mac's own public IPv4 address or global IPv6 prefix; add them here. Ranges inside
    # ::ffff:0:0/96 are refused (smokescreen would apply them to every IPv4 address).
    # example: deny_ranges
    # deny_ranges:
    #   - 203.0.113.7/32
    #   - 2001:db8:1234::/48
    # end example

    # Optional, either mode. host:port destinations allowed even though a deny rule covers
    # their address, e.g. Ollama on the Mac or a LAN model provider. The gateway resolves
    # each name at start; only that port of those addresses opens, for every caller on
    # this network. Restart the gateway after the name's address changes. In allowlist
    # mode callers connect to the address: the ACL lists it, not the name.
    # example: exceptions
    # exceptions:
    #   - host.docker.internal:11434
    # end example

    # Optional. The health check's probes: allow_probe must not be denied, deny_probe must
    # be denied. Defaults: example.com:443 (denylist) or the first non-glob allow entry on
    # port 443 (allowlist), and 169.254.169.254:80.
    # example: health
    # health:
    #   allow_probe: example.com:443
    #   deny_probe: 169.254.169.254:80
    # end example

  # mini-op's network: Claude Code's API and claude.ai login, and the mini's ssh port.
  # Replace 192.0.2.10 with the mini's LAN address in your local copy: in allowlist mode an
  # exception must be an address a deny rule covers, so the placeholder itself is refused.
  # example: mini-op network
  # mini-op:
  #   mode: allowlist
  #   # Required: domains, or *.domain globs (every port of their public addresses).
  #   allow:
  #     - api.anthropic.com
  #     - claude.ai
  #     - claude.com
  #     - platform.claude.com
  #   exceptions:
  #     - 192.0.2.10:22
  # end example
